<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>친구</title>
        <link rel="stylesheet" href="../styles/reset.css" />
        <link rel="stylesheet" href="../styles/global.css" />
        <script
            src="https://kit.fontawesome.com/7ed4aaa020.js"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <div class="layout">
            <aside>
                <ul>
                    <li>
                        <a href="friends.html" class="nav-active">
                            <i class="fa-solid fa-user fa-2x"></i>
                            <p>친구</p>
                        </a>
                    </li>
                    <li>
                        <a href="chat.html">
                            <i class="fa-regular fa-comment fa-2x"></i>
                            <p>채팅</p>
                        </a>
                    </li>
                    <li>
                        <a href="more.html">
                            <i class="fa-solid fa-ellipsis fa-2x"></i>
                            <p>더보기</p>
                        </a>
                    </li>
                </ul>
            </aside>
            <main>
                <header>
                    <h1>친구</h1>
                    <nav>
                        <i class="fa-solid fa-user-plus"></i>
                    </nav>
                </header>
                <section>
                    <i class="fa-solid fa-user"></i>
                    <div class="talk-content">
                        <h2>전병훈</h2>
                        <p>개발하기 싫어요 (과제 중...)</p>
                    </div>
                </section>
                <section class="friends-category">
                    <h3>생일인 친구</h3>
                    <article>
                        <i class="fa-solid fa-cake-candles user-birth"></i>
                        <div class="talk-content">
                            <h2>김철수</h2>
                            <p>오늘 생일이에요!</p>
                        </div>
                    </article>
                </section>
                <section class="friends-category">
                    <h3>친구 5</h3>
                    <article>
                        <i class="fa-solid fa-user"></i>
                        <div class="talk-content">
                            <h2>아무개1</h2>
                            <p>배고프다</p>
                        </div>
                    </article>
                    <article>
                        <i class="fa-solid fa-user"></i>
                        <div class="talk-content">
                            <h2>이동기</h2>
                            <p>졸려요...</p>
                        </div>
                    </article>
                    <article>
                        <i class="fa-solid fa-user"></i>
                        <div class="talk-content">
                            <h2>박미선</h2>
                            <p>여행 가고 싶다</p>
                        </div>
                    </article>
                    <article>
                        <i class="fa-solid fa-user"></i>
                        <div class="talk-content">
                            <h2>최자바</h2>
                            <p>코딩은 즐거워</p>
                        </div>
                    </article>
                    <article>
                        <i class="fa-solid fa-user"></i>
                        <div class="talk-content">
                            <h2>정리액트</h2>
                            <p>상태 관리 너무 어려워</p>
                        </div>
                    </article>
                </section>
            </main>
            <footer>
                <ul>
                    <li>
                        <a href="friends.html" class="nav-active">
                            <i class="fa-solid fa-user fa-2x"></i>
                            <p>친구</p>
                        </a>
                    </li>
                    <li>
                        <a href="chat.html">
                            <i class="fa-regular fa-comment fa-2x"></i>
                            <p>채팅</p>
                        </a>
                    </li>
                    <li>
                        <a href="more.html">
                            <i class="fa-solid fa-ellipsis fa-2x"></i>
                            <p>더보기</p>
                        </a>
                    </li>
                </ul>
            </footer>
        </div>
        <div id="splash-screen">
            <i class="fa-solid fa-comment fa-2x"></i>
        </div>
    </body>
</html>
