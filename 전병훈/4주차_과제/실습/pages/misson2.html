<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>misson2</title>
        <link rel="stylesheet" href="../styles/reset.css" />
        <link rel="stylesheet" href="../styles/misson2.css" />
    </head>
    <body>
        <main>
            <section class="head">
                <h1>게시글 리스트 불러올게용</h1>
                <button>게시글 불러오기</button>
            </section>
            <section class="element"></section>
        </main>
        <script>
            const fetchButton = document.querySelector(".head button");
            const listContainer = document.querySelector(".element");

            fetchButton.addEventListener("click", async () => {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts",
                );
                const posts = await response.json();

                listContainer.innerHTML = "";

                posts.forEach((post) => {
                    const articleElement = document.createElement("article");

                    articleElement.innerHTML = `
                            <h2>${post.title}</h2>
                            <p>${post.body}</p>
                        `;

                    listContainer.appendChild(articleElement);
                });
            });
        </script>
    </body>
</html>
