<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>fetch POST 실습</title>
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <h2>POST 요청으로 게시글 전송</h2>
    <div class="form">
      <form id="postForm">
        <input
          type="text"
          id="title"
          placeholder="제목을 입력하세요"
          required
        />

        <input type="text" id="body" placeholder="내용을 입력하세요">

        <button type="submit">전송</button>
      </form>
    </div>

    <pre id="postResult">응답 결과가 여기에 표시됩니다</pre>

    <script>
      document.getElementById("postForm").addEventListener("submit", (e) => {
        e.preventDefault(); 
        const body = document.getElementById("body").value;
        const title = document.getElementById("title").value;

        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            body: body,
            title: title,
            userId: 1,
          }),
        })
          .then((response) => response.json())
          .then((data) => {console.log("POST 성공:", data)
            document.getElementById("postResult").innerText = JSON.stringify(data, null, 2);
          })
          .catch((error) => console.error("에러 발생:", error));
      });
    </script>
  </body>
</html>
