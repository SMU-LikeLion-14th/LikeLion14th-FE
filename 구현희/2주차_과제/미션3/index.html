<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ball</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 100vh;
      }

      .container {
        position: relative;
        width: 400px;
        height: 300px;
      }

      .ball {
        position: absolute;
        left: 50%;

        width: 50px;
        height: 50px;
        background-color: rgb(242, 4, 186);
        border-radius: 50%;

        animation: moving 2s infinite cubic-bezier(0.165, 0.84, 0.44, 1);
      }

      .shadow {
        position: absolute;
        bottom: 0;
        left: 50%;

        width: 80px;
        height: 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;

        animation: shadowScale 2s infinite ease-in-out;
      }

      .line {
        position: absolute;
        bottom: 0;

        width: 100%;
        height: 4px;
        background-color: black;
      }

      @keyframes moving {
        0% {
          transform: translateX(-50%) translateY(0px);
        }
        50% {
          transform: translateX(-50%) translateY(250px);
        }
        100% {
          transform: translateX(-50%) translateY(0px);
        }
      }

      @keyframes shadowScale {
        0% {
          transform: translateX(-50%) scale(0.5);
          opacity: 0.2;
        }
        50% {
          transform: translateX(-50%) scale(1);
          opacity: 0.7;
        }
        100% {
          transform: translateX(-50%) scale(0.5);
          opacity: 0.2;
        }
      }
    </style>
  </head>

  <body>
    <h3>Mission 3: 공 튀기기</h3>

    <div class="container">
      <div class="ball"></div>
      <div class="shadow"></div>
      <div class="line"></div>
    </div>
  </body>
</html>
