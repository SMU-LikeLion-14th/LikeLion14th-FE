<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[이혜연] fetch GET 실습</title>
    <link rel="stylesheet" href="./fetch_get.css" />
  </head>
  <body>
    <h1>게시글 리스트 불러오기</h1>
    <div>
      <button class="get-btn" onclick="getPost()">게시글 불러오기</button>
    </div>

    <div id="post-list"></div>

    <script>
      function getPost() {
        fetch("https://jsonplaceholder.typicode.com/posts", {
          method: "GET",
        })
          .then((res) => res.json())
          .then((posts) => renderCards(posts))
          .then((data) => console.log("GET 성공: ", data))
          .catch((error) => console.error("에러 발생:", error));
      }

      function renderCards(post) {
        const content = document.getElementById("post-list");
        content.innerHTML = "";

        post.forEach((post) => {
          const card = document.createElement("div");
          card.classList.add("card");

          card.innerHTML = `
          <h2 class="card-title">${post.title}</h2>
          <p class="card-body">${post.body}</p>

      `;
          content.appendChild(card);
        });
      }
    </script>
  </body>
</html>
